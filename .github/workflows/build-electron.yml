name: Auto Build Windows (.exe) on Push

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows .EXE & Auto-Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Auto-Increment App Version on Push
        id: auto_version
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          node scripts/auto-version.cjs

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Build Windows .EXE Installer
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish .EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.auto_version.outputs.version }}
          name: "Krushi Seva ERP v${{ steps.auto_version.outputs.version }}"
          make_latest: true
          body: |
            ## कृषी सेवा केंद्र ERP - Windows Desktop App (.exe)
            
            हे व्हर्जन यशस्वीरित्या कंपाईल आणि पॅकेज झाल्यानंतर तयार करण्यात आले आहे.
            
            - **आवृत्ती (Version):** v${{ steps.auto_version.outputs.version }}
            - **कमिट (Commit):** `${{ github.sha }}`
            - **प्लॅटफॉर्म:** Windows 10/11 (64-bit)
            
            ### डाउनलोड आणि इन्स्टॉलेशन:
            खालील **`Krushi-Seva-ERP-Setup-${{ steps.auto_version.outputs.version }}.exe`** फाईल डाउनलोड करा आणि आपल्या संगणकावर इन्स्टॉल करा.
          files: |
            release/*.exe
            release/latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push Bumped Version to Git
        shell: bash
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(release): auto-bump version to v${{ steps.auto_version.outputs.version }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }} || echo "Auto-commit push skipped or not permitted"

      - name: Upload .EXE as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KrushiSevaERP-Windows-Setup-v${{ steps.auto_version.outputs.version }}
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 30
